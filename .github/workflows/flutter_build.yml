name: Flutter CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  build:
    name: App Build (Android & iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create secrets.env file
        run: |
          echo "SUPA_BASE_URL=${{ secrets.SUPA_BASE_URL }}" > secrets.env
          echo "SUPA_API_KEY=${{ secrets.SUPA_API_KEY }}" >> secrets.env

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android
        run: flutter build apk --debug

      - name: Build iOS (simulator)
        run: flutter build ios --simulator
