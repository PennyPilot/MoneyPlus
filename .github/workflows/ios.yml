name: Flutter CI iOS

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Install dependencies
        run: flutter pub get

      - name: Generate local code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create secrets.env
        run: echo "${{ secrets.SECRETS_ENV_BASE64 }}" | base64 --decode > secrets.env

      - name: Generate Firebase Options
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          flutterfire configure \
            --project=$FIREBASE_PROJECT_ID \
            -y \
            --platforms=ios \
            --out=lib/firebase_options.dart \
            --token=$FIREBASE_TOKEN \
            --ios-bundle-id=com.pennypilot.moneyplus

      - name: Pre-create FlutterFire iOS environment directory
        run: mkdir -p .dart_tool/flutterfire/platforms/ios/default

      - name: Build iOS (simulator)
        run: flutter build ios --simulator --no-codesign