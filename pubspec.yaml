name: moneyplus
description: "A financial management application built with Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management & Logic ---
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  logging: ^1.3.0

  # --- Backend & Auth ---
  supabase_flutter: ^2.12.0
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.0

  # --- Navigation ---
  go_router: ^17.0.1

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  svg_flutter: ^0.0.1
  fl_chart: ^1.1.1
  month_year_picker: ^0.5.0+1
  device_preview: ^1.3.1
  flutter_native_splash: ^2.4.7

  # --- Utils & Internationalization ---
  intl: any
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_remote_config: ^6.1.4
  firebase_analytics: ^12.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  go_router_builder: ^4.0.1
  build_runner: ^2.6.0
  build_verify: any
  integration_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/icons/
    - assets/images/
    - secrets.env

  uses-material-design: true


  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600